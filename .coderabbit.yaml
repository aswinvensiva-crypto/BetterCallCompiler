# CodeRabbit configuration.
#
# The GitHub App itself has to be installed on the repository by an admin — that
# is an account-level authorisation and cannot be done from a commit. This file
# is the half that lives in the repo: once the App is installed it reads this on
# every pull request.
#
# Schema: https://coderabbit.ai/integrations/schema.v2.json

language: en-GB

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true

  # This repository's commit messages carry the reasoning — what was measured,
  # which decisions are load-bearing, and which look optional and are not. A
  # generated title would be strictly less informative than what the author
  # already wrote.
  auto_title_placeholder: '@coderabbitai'

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    # Build output is committed in this repository (see .gitignore) and is
    # generated, so reviewing it is noise that buries the real findings.
    - '!out/**'
    - '!dist/**'
    - '!node_modules/**'
    - '!package-lock.json'
    # Monaco's bundled language grammars are vendored assets, not our code.
    - '!src/renderer/assets/**'

  path_instructions:
    - path: 'src/main/**'
      instructions: |
        Main-process code. Flag anything that would weaken these invariants,
        which are load-bearing and tested:
          - `contextIsolation: true`, `nodeIntegration: false`, `sandbox: true`
          - the production CSP: `connect-src 'none'` must stay, and `script-src`
            may carry `'wasm-unsafe-eval'` but never bare `'unsafe-eval'`
          - every filesystem path crossing the boundary goes through
            `confinePath`; a new path that does not is a finding
          - secrets are one-way: there is no channel that reads a stored key
            back, and adding one is a finding
        `compiler-worker.ts` runs as a plain Node worker_thread and must never
        import `electron` — flag any import that would pull it in.

    - path: 'src/renderer/**'
      instructions: |
        Renderer code, running under `script-src 'self' 'wasm-unsafe-eval'` and
        `connect-src 'none'`. Flag: inline event handlers, `eval`/`new Function`,
        `innerHTML` with interpolated values, `fetch`/`XMLHttpRequest`, blob:
        workers, and any remote URL. None of them can work here, and most fail
        silently rather than loudly.

        There is no UI framework and no store by design. Prefer pointing at an
        existing helper over suggesting one be introduced.

    - path: 'src/shared/**'
      instructions: |
        Shared by main, renderer and a worker thread. These modules must stay
        free of node, electron, typescript and DOM imports — that purity is what
        lets them be unit tested without an Electron window, and a new import
        here is a finding even when it works.

        `ipc-contract.ts` is the only thing either side of the boundary trusts.
        A channel added to `ipc-channels.ts` without a matching zod schema is a
        finding.

    - path: 'test/**'
      instructions: |
        Tests here state WHY a rule exists, not just what it does. Flag
        assertions that pin an incidental detail (an exact rendered string, a
        count that moves for unrelated reasons) rather than the behaviour under
        test — those break for the wrong reasons and get deleted rather than
        fixed.

        E2E specs run against a built app with real chokidar, a real
        worker_thread and a real LanguageService. Flag fixed `waitForTimeout`
        sleeps used as synchronisation; wait on a condition instead.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 300000
    # Not configured in this repository; leaving them on produces "tool missing"
    # noise on every review rather than findings.
    eslint:
      enabled: false
    biome:
      enabled: false
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true
