appId: com.aperture.ide
productName: Aperture
copyright: Aperture

directories:
  output: dist
  buildResources: resources

# electron-vite has already bundled main, preload and renderer into out/. Only
# that and the packages that cannot be bundled need to ship.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.git,.github,test,docs,.vscode}/**'

# node-pty 1.1.0 is a Node-API addon — it depends on node-addon-api, ships no
# binding.gyp, and carries prebuilds for every platform it supports. Node-API is
# ABI-stable across Node and Electron versions by design, which is exactly why
# the app runs and the terminal tests pass on a machine with no C++ toolchain.
#
# Left on, electron-builder invokes @electron/rebuild anyway, which calls
# node-gyp and fails with "Could not find any Visual Studio installation" —
# demanding a compiler to rebuild something that never needed compiling. If a
# native module without prebuilds is ever added, this has to come back on and
# the Build Tools prerequisite in the README becomes real.
npmRebuild: false

asar: true

# node-pty ships a native .node binding and spawns helper executables
# (conpty_console_list_agent.js, winpty-agent.exe). Neither a native module nor
# a spawned helper can be loaded from inside an asar archive, so this directory
# is unpacked to app.asar.unpacked and loaded from disk.
asarUnpack:
  - '**/node_modules/node-pty/**'

win:
  # nsis for the real installer, portable for a single .exe that needs no
  # install at all — the zero-install story the product is built around.
  target:
    - nsis
    - portable
  artifactName: Aperture-Setup-${version}.exe
  icon: resources/icon.ico

nsis:
  # Per-user install: no elevation prompt, and no admin rights required. The
  # moment this becomes perMachine, every install shows a UAC dialog.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aperture
  deleteAppDataOnUninstall: false

portable:
  artifactName: Aperture-Portable-${version}.exe

# Not built in M1. Left here, commented, because the shape of these entries is
# the thing worth keeping — reconstructing them later is where the mistakes are.
#
# mac:
#   target: [dmg, zip]
#   category: public.app-category.developer-tools
#   icon: resources/icon.icns
#   hardenedRuntime: true
#   entitlements: resources/entitlements.mac.plist
#
# linux:
#   target: [AppImage, deb]
#   category: Development
#   icon: resources/icon.png

# Unsigned builds trigger SmartScreen. See the README: removing that needs an
# OV/EV certificate supplied through CSC_LINK and CSC_KEY_PASSWORD, and OV
# reputation additionally accrues with download volume.
